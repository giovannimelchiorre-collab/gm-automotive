
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reimposta password - G.M. Automotive</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body {
  margin:0;
  background:#101010;
  color:white;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}
.box {
  width:85%;
  max-width:380px;
  background:#1b1b1b;
  padding:25px;
  border:1px solid #c5a044;
  border-radius:12px;
}
h2 { color:#d4af37; text-align:center; }
input,button {
  width:100%;
  box-sizing:border-box;
  padding:13px;
  margin-top:14px;
  border-radius:6px;
  font-size:16px;
}
input { background:#292929; color:white; border:1px solid #555; }
button {
  background:#d4af37;
  color:#111;
  border:0;
  font-weight:bold;
}
#msg { margin-top:15px; line-height:1.5; }
</style>
</head>
<body>
<div class="box">
<h2>G.M. Automotive</h2>
<p>Inserisci la nuova password.</p>
<input id="password" type="password" placeholder="Nuova password" autocomplete="new-password">
<input id="confirm" type="password" placeholder="Conferma nuova password" autocomplete="new-password">
<button onclick="resetPassword()">SALVA NUOVA PASSWORD</button>
<p id="msg"></p>
</div>

<script>
const db = supabase.createClient(
  'https://amnibfcgruniqzvjoaxn.supabase.co',
  'sb_publishable_ya3B1_8f4nh5J4sokWhCHw_6mzOjWWv'
);

async function resetPassword() {
  const msg = document.getElementById('msg');
  const password = document.getElementById('password').value;
  const confirm = document.getElementById('confirm').value;

  if (password.length < 8) {
    msg.textContent = 'La password deve contenere almeno 8 caratteri.';
    return;
  }
  if (password !== confirm) {
    msg.textContent = 'Le password non coincidono.';
    return;
  }

  msg.textContent = 'Salvataggio in corso...';

  const { error } = await db.auth.updateUser({ password });

  if (error) {
    msg.textContent = 'Errore: ' + error.message;
  } else {
    msg.textContent = 'Password aggiornata! Ora puoi accedere.';
    setTimeout(() => {
      window.location.href = './login.html';
    }, 2000);
  }
}
</script>
</body>
</html>
