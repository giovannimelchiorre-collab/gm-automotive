
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101010">
<title>Trasporti - G.M. Automotive</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 padding:20px;
 background:#101010;
 color:white;
 font-family:Arial,sans-serif;
}

.container{
 max-width:950px;
 margin:auto;
}

header{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:12px;
 flex-wrap:wrap;
 margin-bottom:25px;
}

h1,h2{color:#d4af37}

h1{font-size:25px;margin:0}
h2{font-size:21px}

a.home{
 color:#d4af37;
 text-decoration:none;
 border:1px solid #d4af37;
 padding:10px 14px;
 border-radius:8px;
}

.card{
 background:#1b1b1b;
 border:1px solid #806b2a;
 border-radius:12px;
 padding:20px;
 margin-bottom:22px;
}

label{
 display:block;
 margin:14px 0 6px;
 color:#d4af37;
 font-weight:bold;
}

input,select,textarea{
 width:100%;
 padding:12px;
 border:1px solid #555;
 border-radius:7px;
 background:#292929;
 color:white;
 font-size:16px;
}

textarea{
 min-height:75px;
 resize:vertical;
}

button{
 border:0;
 border-radius:7px;
 padding:12px 16px;
 font-size:15px;
 font-weight:bold;
 cursor:pointer;
}

.salva{
 background:#d4af37;
 color:#111;
 width:100%;
 margin-top:20px;
}

.secondario{
 background:#333;
 color:white;
 border:1px solid #777;
}

.modifica{
 background:#d4af37;
 color:#111;
}

.elimina{
 background:#a83232;
 color:white;
}

.trasporto{
 border:1px solid #555;
 border-radius:9px;
 padding:15px;
 margin-top:13px;
 background:#222;
}

.trasporto strong{color:#d4af37}

.azioni{
 display:flex;
 gap:9px;
 flex-wrap:wrap;
 margin-top:13px;
}

.azioni button{flex:1}

.nascosto{display:none}

#messaggio{
 margin-top:12px;
 color:#d4af37;
 white-space:pre-wrap;
}

#elenco{margin-top:15px}

@media(max-width:600px){
 body{padding:13px}
 .card{padding:15px}
 header{align-items:flex-start}
}
</style>
</head>

<body>
<div class="container">

<header>
 <h1>G.M. AUTOMOTIVE</h1>
 <a class="home" href="./index.html">← Home</a>
</header>

<div class="card" id="formCard">
 <h2 id="titoloForm">Nuovo trasporto</h2>

 <form id="formTrasporto">

  <label for="veicolo">Veicolo</label>
  <input id="veicolo" type="text" placeholder="Marca e modello">

  <label for="targa">Targa</label>
  <input id="targa" type="text" placeholder="Targa">

  <label for="ritiro">Luogo di ritiro</label>
  <input id="ritiro" type="text" placeholder="Indirizzo di ritiro">

  <label for="consegna">Luogo di consegna</label>
  <input id="consegna" type="text" placeholder="Indirizzo di consegna">

  <label for="distanza">Distanza (km)</label>
  <input id="distanza" type="number" min="0" step="0.1" placeholder="Es. 250">

  <label for="modalitaPrezzo">Modalità prezzo</label>
  <select id="modalitaPrezzo">
   <option value="km">Prezzo al km</option>
   <option value="libero">Tariffa libera</option>
  </select>

  <div id="tariffaField">
   <label for="tariffa">Tariffa al km (€)</label>
   <input id="tariffa" type="number" min="0" step="0.01" placeholder="Es. 1.20">
  </div>

  <label for="prezzo">Prezzo totale (€)</label>
  <input id="prezzo" type="number" min="0" step="0.01" placeholder="Prezzo totale">

  <label for="stato">Stato</label>
  <select id="stato">
   <option value="Da effettuare">Da effettuare</option>
   <option value="In corso">In corso</option>
   <option value="Completato">Completato</option>
  </select>

  <label for="note">Note</label>
  <textarea id="note" placeholder="Note sul trasporto"></textarea>

  <button class="salva" id="pulsanteSalva" type="submit">
   SALVA TRASPORTO
  </button>

  <button class="secondario nascosto" id="annullaModifica" type="button"
   style="width:100%;margin-top:10px" onclick="resetForm()">
   ANNULLA MODIFICA
  </button>

  <div id="messaggio"></div>
 </form>
</div>

<div class="card">
 <h2>Elenco trasporti</h2>
 <div id="elenco">Caricamento...</div>
</div>

</div>

<script>
const SUPABASE_URL = 'https://amnibfcgruniqzvjoaxn.supabase.co';

const SUPABASE_KEY = 'sb_publishable_ya3B1_8f4nh5J4sokWhCHw_6mzOjWWv';

const db = window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

let modificaId = null;

const $ = id => document.getElementById(id);

function mostraMessaggio(testo){
 $('messaggio').textContent = testo;
}

function escapeHtml(valore){
 return String(valore ?? '').replace(/[&<>"']/g, carattere => ({
  '&':'&amp;',
  '<':'&lt;',
  '>':'&gt;',
  '"':'&quot;',
  "'":'&#039;'
 })[carattere]);
}

function aggiornaModalitaPrezzo(){
 const modalita = $('modalitaPrezzo').value;
 const tariffaField = $('tariffaField');
 const prezzo = $('prezzo');

 if(modalita === 'km'){
  tariffaField.classList.remove('nascosto');
  prezzo.readOnly = true;
  prezzo.placeholder = 'Calcolo automatico';
  calcolaPrezzo();
 }else{
  tariffaField.classList.add('nascosto');
  prezzo.readOnly = false;
  prezzo.placeholder = 'Inserisci il prezzo manualmente';
 }
}

function calcolaPrezzo(){
 if($('modalitaPrezzo').value !== 'km') return;

 const km = parseFloat($('distanza').value);
 const tariffa = parseFloat($('tariffa').value);

 if(!Number.isFinite(km) || !Number.isFinite(tariffa)){
  $('prezzo').value = '';
  return;
 }

 $('prezzo').value = (km * tariffa).toFixed(2);
}

function leggiDati(){
 const modalita = $('modalitaPrezzo').value;
 const prezzo = $('prezzo').value;

 return {
  veicolo: $('veicolo').value.trim(),
  targa: $('targa').value.trim(),
  luogo_ritiro: $('ritiro').value.trim(),
  luogo_consegna: $('consegna').value.trim(),
  distanza_km: $('distanza').value === ''
   ? null : Number($('distanza').value),
  prezzo: prezzo === '' ? null : Number(prezzo),
  tariffa_km: modalita === 'km' && $('tariffa').value !== ''
   ? Number($('tariffa').value) : null,
  modalita_prezzo: modalita,
  stato: $('stato').value,
  note: $('note').value.trim()
 };
}

function resetForm(){
 modificaId = null;
 $('formTrasporto').reset();
 $('titoloForm').textContent = 'Nuovo trasporto';
 $('pulsanteSalva').textContent = 'SALVA TRASPORTO';
 $('annullaModifica').classList.add('nascosto');
 $('prezzo').readOnly = true;
 aggiornaModalitaPrezzo();
 mostraMessaggio('');
}

$('modalitaPrezzo').addEventListener('change', aggiornaModalitaPrezzo);
$('distanza').addEventListener('input', calcolaPrezzo);
$('tariffa').addEventListener('input', calcolaPrezzo);

$('formTrasporto').addEventListener('submit', async function(event){
 event.preventDefault();
 mostraMessaggio('');

 const dati = leggiDati();

 if(dati.modalita_prezzo === 'km'){
  if(dati.distanza_km === null || dati.tariffa_km === null){
   mostraMessaggio('Inserisci distanza e tariffa al km.');
   return;
  }
  dati.prezzo = dati.distanza_km * dati.tariffa_km;
 }else{
  if(dati.prezzo === null || dati.prezzo < 0){
   mostraMessaggio('Inserisci un prezzo valido.');
   return;
  }
 }

 if(dati.distanza_km !== null && dati.distanza_km < 0){
  mostraMessaggio('La distanza non può essere negativa.');
  return;
 }

 if(dati.prezzo < 0){
  mostraMessaggio('Il prezzo non può essere negativo.');
  return;
 }

 $('pulsanteSalva').disabled = true;
 $('pulsanteSalva').textContent = 'SALVATAGGIO...';

 try{
  let risultato;

  if(modificaId){
   risultato = await db
    .from('richieste')
    .update(dati)
    .eq('id', modificaId);
  }else{
   risultato = await db
    .from('richieste')
    .insert([dati]);
  }

  if(risultato.error) throw risultato.error;

  mostraMessaggio(modificaId
   ? 'Trasporto modificato correttamente.'
   : 'Trasporto salvato correttamente.');

  resetForm();
  await caricaTrasporti();

 }catch(error){
  console.error(error);
  mostraMessaggio('Errore nel salvataggio: ' + error.message);
 }finally{
  $('pulsanteSalva').disabled = false;
  $('pulsanteSalva').textContent = modificaId
   ? 'SALVA MODIFICA' : 'SALVA TRASPORTO';
 }
});

async function controlloAccesso(){
 const {data,error} = await db.auth.getSession();

 if(error) throw error;

 if(!data.session){
  window.location.href = './login.html';
  return false;
 }

 return true;
}

async function caricaTrasporti(){
 const elenco = $('elenco');
 elenco.textContent = 'Caricamento...';

 try{
  const {data,error} = await db
   .from('richieste')
   .select('*')
   .order('created_at',{ascending:false});

  if(error) throw error;

  if(!data || data.length === 0){
   elenco.textContent = 'Nessun trasporto presente.';
   return;
  }

  elenco.innerHTML = '';

  data.forEach(item => {
   const prezzo = item.prezzo === null || item.prezzo === undefined
    ? '—' : Number(item.prezzo).toFixed(2) + ' €';

   const modalita = item.modalita_prezzo || 'km';

   const tariffa = item.tariffa_km === null ||
    item.tariffa_km === undefined
    ? '—' : Number(item.tariffa_km).toFixed(2) + ' €/km';

   const div = document.createElement('div');
   div.className = 'trasporto';

   div.innerHTML = `
    <div><strong>Veicolo:</strong> ${escapeHtml(item.veicolo)}</div>
    <div><strong>Targa:</strong> ${escapeHtml(item.targa)}</div>
    <div><strong>Ritiro:</strong> ${escapeHtml(item.luogo_ritiro)}</div>
    <div><strong>Consegna:</strong> ${escapeHtml(item.luogo_consegna)}</div>
    <div><strong>Distanza:</strong> ${escapeHtml(item.distanza_km ?? '—')} km</div>
    <div><strong>Modalità:</strong> ${modalita === 'libero' ? 'Tariffa libera' : 'Prezzo al km'}</div>
    <div><strong>Tariffa:</strong> ${escapeHtml(tariffa)}</div>
    <div><strong>Prezzo:</strong> ${escapeHtml(prezzo)}</div>
    <div><strong>Stato:</strong> ${escapeHtml(item.stato)}</div>
    <div><strong>Note:</strong> ${escapeHtml(item.note)}</div>

    <div class="azioni">
     <button class="modifica" onclick="modificaTrasporto('${escapeHtml(item.id)}')">
      MODIFICA
     </button>
     <button class="elimina" onclick="eliminaTrasporto('${escapeHtml(item.id)}')">
      ELIMINA
     </button>
    </div>
   `;

   elenco.appendChild(div);
  });

 }catch(error){
  console.error(error);
  elenco.textContent = 'Errore nel caricamento: ' + error.message;
 }
}

async function modificaTrasporto(id){
 try{
  const {data,error} = await db
   .from('richieste')
   .select('*')
   .eq('id',id)
   .single();

  if(error) throw error;

  modificaId = id;

  $('veicolo').value = data.veicolo || '';
  $('targa').value = data.targa || '';
  $('ritiro').value = data.luogo_ritiro || '';
  $('consegna').value = data.luogo_consegna || '';
  $('distanza').value = data.distanza_km ?? '';
  $('modalitaPrezzo').value = data.modalita_prezzo || 'km';
  $('tariffa').value = data.tariffa_km ?? '';
  $('prezzo').value = data.prezzo ?? '';
  $('stato').value = data.stato || 'Da effettuare';
  $('note').value = data.note || '';

  aggiornaModalitaPrezzo();

  if($('modalitaPrezzo').value === 'libero'){
   $('prezzo').value = data.prezzo ?? '';
  }

  $('titoloForm').textContent = 'Modifica trasporto';
  $('pulsanteSalva').textContent = 'SALVA MODIFICA';
  $('annullaModifica').classList.remove('nascosto');

  mostraMessaggio('Stai modificando il trasporto selezionato.');

  window.scrollTo({top:0,behavior:'smooth'});

 }catch(error){
  alert('Errore nella modifica: ' + error.message);
 }
}

async function eliminaTrasporto(id){
 if(!confirm('Vuoi eliminare questo trasporto?')) return;

 try{
  const {error} = await db
   .from('richieste')
   .delete()
   .eq('id',id);

  if(error) throw error;

  await caricaTrasporti();

 }catch(error){
  alert('Errore durante eliminazione: ' + error.message);
 }
}

(async function avvio(){
 try{
  const accesso = await controlloAccesso();

  if(accesso){
   aggiornaModalitaPrezzo();
   await caricaTrasporti();
  }
 }catch(error){
  console.error(error);
  $('elenco').textContent = 'Errore: ' + error.message;
 }
})();
</script>

</body>
</html>
