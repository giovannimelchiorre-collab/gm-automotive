
<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101010">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>G.M. Automotive - Verbali</title>

<style>
:root{--gold:#c8a45d;--bg:#101010;--panel:#1b1b1b;--muted:#aaa}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#f5f1e8;font:16px system-ui}
header{padding:18px;background:#080808;border-bottom:1px solid #6e572c}
header b{color:var(--gold);letter-spacing:2px}
.home{display:inline-block;color:var(--gold);text-decoration:none;font-weight:bold;margin-bottom:14px}
main{max-width:760px;margin:auto;padding:18px}
.card{background:var(--panel);border:1px solid #59482a;border-radius:14px;padding:16px;margin:14px 0}
h1{font-size:22px;margin:4px 0 8px}
h2{font-size:18px;color:var(--gold)}
label{display:block;margin:12px 0 5px;color:#ddd}
input,select,textarea{width:100%;padding:12px;border-radius:8px;border:1px solid #555;background:#101010;color:white;font:inherit}
textarea{min-height:80px}
button{background:var(--gold);color:#111;border:0;border-radius:8px;padding:13px 16px;font-weight:700;font-size:15px;margin:8px 5px 0 0;cursor:pointer}
button.secondary{background:#333;color:white;border:1px solid #777}
button.danger{background:#8d2929;color:white;border:1px solid #b44}
.muted{color:var(--muted);font-size:13px}
.report{border-top:1px solid #444;padding:12px 0}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photos img{width:90px;height:90px;object-fit:cover;border-radius:8px}
.sig{width:100%;height:130px;background:#fff;border-radius:8px;touch-action:none}
.actions{position:sticky;bottom:0;background:#101010;padding:10px 0}
.total{padding:15px;background:#101010;border:1px solid var(--gold);border-radius:10px;margin-top:15px}
.total strong{color:var(--gold);font-size:23px}

@media print{
.actions,.home,header button{display:none!important}
}
</style>
</head>

<body>

<header>
<a class="home" href="./index.html">← TORNA ALLA HOME</a>
<div><b>G.M. AUTOMOTIVE</b></div>
<div class="muted">GESTIONE TRASPORTI</div>
</header>

<main>

<h1>Verbali di ritiro e consegna</h1>
<p class="muted">Compilazione e archiviazione dei verbali su questo dispositivo.</p>

<section class="card">
<h2>Nuovo verbale</h2>

<label>Numero richiesta</label>
<input id="request" placeholder="Es. GM-0001">

<label>Tipo verbale</label>
<select id="kind">
<option>RITIRO</option>
<option>CONSEGNA</option>
</select>

<label>Veicolo</label>
<input id="vehicle" placeholder="Marca e modello">

<label>Targa</label>
<input id="plate" placeholder="AB123CD">

<label>Luogo di ritiro</label>
<input id="place" placeholder="Indirizzo di ritiro">

<label>Destinazione</label>
<input id="destination" placeholder="Indirizzo di consegna">

<label>Chilometri veicolo</label>
<input id="km" type="number" min="0" placeholder="Km contachilometri">

<h2>Calcolo trasporto</h2>

<label>Chilometri trasporto</label>
<input id="transportKm" type="number" min="0" step="0.1" placeholder="Es. 150">

<label>Tariffa al chilometro (€)</label>
<input id="rate" type="number" min="0" step="0.01" placeholder="Inserisci la tua tariffa">

<div class="total">
<div class="muted">TOTALE TRASPORTO</div>
<strong id="total">0,00 €</strong>
</div>

<label>Condizioni del veicolo</label>
<select id="condition">
<option>Buone condizioni</option>
<option>Con danni / segni da annotare</option>
<option>Non marciante</option>
</select>

<label>Danni e annotazioni</label>
<textarea id="notes" placeholder="Descrivi eventuali danni, graffi o anomalie"></textarea>

<label>Fotografie</label>
<input id="photos" type="file" accept="image/*" multiple capture="environment">
<div id="preview" class="photos"></div>

<label>Firma trasportatore</label>
<canvas id="sig1" class="sig"></canvas>
<button class="secondary" onclick="clearSig('sig1')">Cancella firma</button>

<label>Firma cliente / destinatario</label>
<canvas id="sig2" class="sig"></canvas>
<button class="secondary" onclick="clearSig('sig2')">Cancella firma</button>

<div class="actions">
<button onclick="save()">Salva verbale su questo iPhone</button>
<button class="secondary" onclick="window.print()">Stampa / Salva PDF</button>
</div>

</section>

<section class="card">
<h2>Verbali salvati su questo dispositivo</h2>
<div id="saved" class="muted">Nessun verbale salvato.</div>
</section>

</main>

<script>
const $=id=>document.getElementById(id);
let photoData=[];

function money(n){
return Number(n||0).toLocaleString('it-IT',{
minimumFractionDigits:2,
maximumFractionDigits:2
})+' €';
}

function calculate(){
const km=Number($('transportKm').value)||0;
const rate=Number($('rate').value)||0;
$('total').textContent=money(km*rate);
}

$('transportKm').addEventListener('input',calculate);
$('rate').addEventListener('input',calculate);

$('photos').addEventListener('change',async e=>{
photoData=[];
$('preview').innerHTML='';

for(const f of e.target.files){
const d=await new Promise(ok=>{
const r=new FileReader();
r.onload=()=>ok(r.result);
r.readAsDataURL(f);
});

photoData.push(d);

const im=document.createElement('img');
im.src=d;
$('preview').append(im);
}
});

function setup(id){
const c=$(id),ctx=c.getContext('2d');

function resize(){
const r=c.getBoundingClientRect();
c.width=r.width*devicePixelRatio;
c.height=130*devicePixelRatio;
ctx.scale(devicePixelRatio,devicePixelRatio);
ctx.lineWidth=2;
ctx.lineCap='round';
ctx.strokeStyle='#111';
}
resize();

let down=false,last=null;

function pos(e){
const r=c.getBoundingClientRect();
return{x:e.clientX-r.left,y:e.clientY-r.top};
}

c.addEventListener('pointerdown',e=>{
down=true;
last=pos(e);
c.setPointerCapture(e.pointerId);
});

c.addEventListener('pointermove',e=>{
if(!down)return;
const p=pos(e);
ctx.beginPath();
ctx.moveTo(last.x,last.y);
ctx.lineTo(p.x,p.y);
ctx.stroke();
last=p;
});

c.addEventListener('pointerup',()=>down=false);
c.addEventListener('pointercancel',()=>down=false);
}

setup('sig1');
setup('sig2');

function clearSig(id){
const c=$(id);
c.getContext('2d').clearRect(0,0,c.width,c.height);
}

function save(){
const km=Number($('transportKm').value)||0;
const rate=Number($('rate').value)||0;

const v={
request:$('request').value,
kind:$('kind').value,
vehicle:$('vehicle').value,
plate:$('plate').value,
place:$('place').value,
destination:$('destination').value,
km:$('km').value,
transportKm:km,
rate:rate,
transportTotal:km*rate,
condition:$('condition').value,
notes:$('notes').value,
photos:photoData,
signature1:$('sig1').toDataURL(),
signature2:$('sig2').toDataURL(),
date:new Date().toLocaleString('it-IT')
};

if(!v.request||!v.vehicle){
alert('Inserisci almeno numero richiesta e veicolo.');
return;
}

const a=JSON.parse(localStorage.getItem('gm_reports')||'[]');
a.unshift(v);

try{
localStorage.setItem('gm_reports',JSON.stringify(a));
render();
alert('Verbale salvato su questo iPhone.');
}catch(e){
alert('Spazio locale insufficiente: riduci il numero o la dimensione delle foto.');
}
}

function escapeHTML(s){
return String(s??'').replace(/[&<>"']/g,c=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'
}[c]));
}

// ELIMINAZIONE VERBALE
function deleteReport(i){
if(!confirm('Vuoi eliminare definitivamente questo verbale?'))
return;

const a=JSON.parse(localStorage.getItem('gm_reports')||'[]');

if(i<0||i>=a.length)return;

a.splice(i,1);

localStorage.setItem('gm_reports',JSON.stringify(a));

render();

alert('Verbale eliminato correttamente.');
}

// ELENCO VERBALI
function render(){
const a=JSON.parse(localStorage.getItem('gm_reports')||'[]');

$('saved').innerHTML=a.length?a.map((v,i)=>`
<div class="report">
<b>${escapeHTML(v.kind)} · ${escapeHTML(v.request)}</b><br>
${escapeHTML(v.vehicle)} ${escapeHTML(v.plate||'')}<br>
${escapeHTML(v.date)}<br>

<button class="secondary" onclick="showReport(${i})">
Apri / stampa
</button>

<button class="danger" onclick="deleteReport(${i})">
ELIMINA
</button>

</div>
`).join(''):'Nessun verbale salvato.';
}

// APERTURA VERBALE E STAMPA
function showReport(i){

const a=JSON.parse(localStorage.getItem('gm_reports')||'[]');
const v=a[i];

if(!v)return;

const w=window.open('','_blank');

if(!w){
alert('Consenti i popup per aprire il verbale.');
return;
}

const photos=(v.photos||[]).map(x=>
`<img src="${x}">`
).join('');

const km=Number(v.transportKm)||0;
const rate=Number(v.rate)||0;

const total=v.transportTotal!==undefined?
Number(v.transportTotal):km*rate;

w.document.write(`
<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verbale ${escapeHTML(v.request)}</title>

<style>
body{
font:16px Arial,sans-serif;
padding:24px;
color:#222;
max-width:850px;
margin:auto;
}
h1{color:#9a762e}
h2{color:#9a762e;margin-top:25px}
img{max-width:180px;max-height:130px;margin:6px;object-fit:contain}
.total{
border:1px solid #9a762e;
padding:12px;
font-size:22px;
}
.report-actions{
background:#f2f2f2;
padding:15px;
border-radius:10px;
margin-bottom:25px;
}
.report-actions button{
padding:12px 18px;
margin:5px;
border:0;
border-radius:7px;
background:#9a762e;
color:white;
font-weight:bold;
font-size:15px;
}
.signatures img{
width:220px;
height:100px;
object-fit:contain;
border:1px solid #ddd;
}
@media print{
.report-actions{display:none!important}
body{padding:5px}
}
</style>
</head>

<body>

<div class="report-actions">
<button onclick="window.print()">STAMPA / SALVA PDF</button>
<button onclick="returnToReports()">← TORNA AI VERBALI</button>
</div>

<h1>G.M. AUTOMOTIVE</h1>
<h2>VERBALE ${escapeHTML(v.kind)}</h2>

<p>
Richiesta: ${escapeHTML(v.request)}<br>
Data: ${escapeHTML(v.date)}<br>
Veicolo: ${escapeHTML(v.vehicle)}<br>
Targa: ${escapeHTML(v.plate)}<br>
Luogo di ritiro: ${escapeHTML(v.place)}<br>
Destinazione: ${escapeHTML(v.destination)}<br>
Chilometri veicolo: ${escapeHTML(v.km)}<br>
Condizioni: ${escapeHTML(v.condition)}<br>
Note: ${escapeHTML(v.notes)}
</p>

<h2>DETTAGLIO TRASPORTO</h2>

<p>
Chilometri trasporto: ${km} km<br>
Tariffa al chilometro: ${money(rate)}
</p>

<div class="total">
TOTALE TRASPORTO: <b>${money(total)}</b>
</div>

<h2>Fotografie</h2>
${photos}

<div class="signatures">
<h2>Firma trasportatore</h2>
<img src="${v.signature1}">

<h2>Firma cliente / destinatario</h2>
<img src="${v.signature2}">
</div>

<script>
function returnToReports(){
window.close();

setTimeout(function(){
if(!window.closed){
window.location.href='./verbali.html';
}
},200);
}

window.onload=function(){
setTimeout(function(){
window.print();
},500);
};
<\/script>

</body>
</html>
`);

w.document.close();
}

render();
</script>

</body>
</html>
