<link rel="apple-touch-icon" hrefhead><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111"><link rel="manifest" href="manifest.webmanifest"><title>G.M. Automotive</title><style>
:root{--gold:#c8a45d;--bg:#101010;--panel:#1b1b1b;--muted:#aaa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f5f1e8;font:16px system-ui}header{padding:24px 18px;background:#080808;border-bottom:1px solid #6e572c}header b{color:var(--gold);letter-spacing:2px}main{max-width:760px;margin:auto;padding:18px}.card{background:var(--panel);border:1px solid #59482a;border-radius:14px;padding:16px;margin:14px 0}h1{font-size:22px;margin:4px 0 8px}h2{font-size:18px;color:var(--gold)}label{display:block;margin:12px 0 5px;color:#ddd}input,select,textarea{width:100%;padding:12px;border-radius:8px;border:1px solid #555;background:#101010;color:white;font:inherit}textarea{min-height:80px}button,.btn{background:var(--gold);color:#111;border:0;border-radius:8px;padding:13px 16px;font-weight:700;font-size:15px;display:inline-block;margin:8px 5px 0 0}button.secondary{background:#333;color:white;border:1px solid #777}.muted{color:var(--muted);font-size:13px}.report{border-top:1px solid #444;padding:12px 0}.photos{display:flex;gap:8px;flex-wrap:wrap}.photos img{width:90px;height:90px;object-fit:cover;border-radius:8px}.sig{width:100%;height:130px;background:#fff;border-radius:8px;touch-action:none}.actions{position:sticky;bottom:0;background:#101010;padding:10px 0}
</style></head><body><header><b>G.M. AUTOMOTIVE</b><div class="muted">GESTIONE TRASPORTI · AREA DIMOSTRATIVA</div></header><main><h1>Verbali di ritiro e consegna</h1><p class="muted">Prototipo locale per provare la compilazione dei verbali da iPhone. I dati restano su questo dispositivo e non vengono inviati a G.M.</p>
<section class="card"><h2>Nuovo verbale</h2><label>Numero richiesta</label><input id="request" placeholder="Es. GM-0001"><label>Tipo verbale</label><select id="kind"><option>RITIRO</option><option>CONSEGNA</option></select><label>Veicolo</label><input id="vehicle" placeholder="Marca e modello"><label>Targa</label><input id="plate" placeholder="AB123CD"><label>Luogo</label><input id="place" placeholder="Indirizzo o località"><label>Chilometri</label><input id="km" type="number" min="0" placeholder="Km"><label>Condizioni del veicolo</label><select id="condition"><option>Buone condizioni</option><option>Con danni / segni da annotare</option><option>Non marciante</option></select><label>Danni e annotazioni</label><textarea id="notes" placeholder="Descrivi eventuali danni, graffi o anomalie"></textarea><label>Fotografie</label><input id="photos" type="file" accept="image/*" multiple capture="environment"><div id="preview" class="photos"></div><label>Firma trasportatore</label><canvas id="sig1" class="sig"></canvas><button class="secondary" onclick="clearSig('sig1')">Cancella firma</button><label>Firma cliente / destinatario</label><canvas id="sig2" class="sig"></canvas><button class="secondary" onclick="clearSig('sig2')">Cancella firma</button><div class="actions"><button onclick="save()">Salva verbale su questo iPhone</button><button class="secondary" onclick="window.print()">Stampa / Salva PDF</button></div></section>
<section class="card"><h2>Verbali salvati su questo dispositivo</h2><div id="saved" class="muted">Nessun verbale salvato.</div></section>
</main><script>
const $=id=>document.getElementById(id);let photoData=[];
$('photos').addEventListener('change',async e=>{photoData=[];$('preview').innerHTML='';for(const f of e.target.files){const d=await new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(r.result);r.readAsDataURL(f)});photoData.push(d);const im=document.createElement('img');im.src=d;$('preview').append(im)}});
function setup(id){const c=$(id),ctx=c.getContext('2d');function resize(){const r=c.getBoundingClientRect();const old=c.toDataURL();c.width=r.width*devicePixelRatio;c.height=130*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio);ctx.lineWidth=2;ctx.lineCap='round';ctx.strokeStyle='#111';if(old&&old!=='data:,'){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,r.width,130);im.src=old}}resize();let down=false,last=null;function pos(e){const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}c.addEventListener('pointerdown',e=>{down=true;last=pos(e);c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(!down)return;const p=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p});c.addEventListener('pointerup',()=>down=false);c.addEventListener('pointercancel',()=>down=false)}
setup('sig1');setup('sig2');function clearSig(id){const c=$(id),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height)}
function save(){const v={request:$('request').value,kind:$('kind').value,vehicle:$('vehicle').value,plate:$('plate').value,place:$('place').value,km:$('km').value,condition:$('condition').value,notes:$('notes').value,photos:photoData,signature1:$('sig1').toDataURL(),signature2:$('sig2').toDataURL(),date:new Date().toLocaleString('it-IT')};if(!v.request||!v.vehicle){alert('Inserisci almeno numero richiesta e veicolo.');return}const a=JSON.parse(localStorage.getItem('gm_reports')||'[]');a.unshift(v);try{localStorage.setItem('gm_reports',JSON.stringify(a));render();alert('Verbale salvato su questo iPhone.')}catch(e){alert('Spazio locale insufficiente: riduci il numero o la dimensione delle foto.')}}function render(){const a=JSON.parse(localStorage.getItem('gm_reports')||'[]');$('saved').innerHTML=a.length?a.map((v,i)=>`<div class="report"><b>${v.kind} · ${v.request}</b><br>${v.vehicle} ${v.plate||''}<br>${v.date}<br><button class="secondary" onclick="showReport(${i})">Apri / stampa</button></div>`).join(''):'Nessun verbale salvato.'}function showReport(i){const v=JSON.parse(localStorage.getItem('gm_reports')||'[]')[i];const w=window.open('','_blank');if(!w){alert('Consenti i popup per aprire il verbale.');return}w.document.write(`<html><head><title>Verbale ${v.request}</title><style>body{font:16px Arial;padding:24px}img{max-width:180px;max-height:130px;margin:6px}h1{color:#9a762e}</style></head><body><h1>G.M. AUTOMOTIVE — VERBALE ${v.kind}</h1><p>Richiesta: ${v.request}<br>Data: ${v.date}<br>Veicolo: ${v.vehicle}<br>Targa: ${v.plate}<br>Luogo: ${v.place}<br>Km: ${v.km}<br>Condizioni: ${v.condition}<br>Note: ${v.notes}</p><h3>Fotografie</h3>${(v.photos||[]).map(x=>`<img src="${x}">`).join('')}<h3>Firma trasportatore</h3><img src="${v.signature1}"><h3>Firma cliente</h3><img src="${v.signature2}"><script>setTimeout(()=>window.print(),500)<\/script></body></html>`);w.document.close()}render();
</script></body></html>
