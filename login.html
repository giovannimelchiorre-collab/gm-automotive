
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accesso G.M. Automotive</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body {
  background:#101010;color:white;font-family:Arial;
  display:flex;justify-content:center;align-items:center;
  min-height:100vh;margin:0;padding:20px;
}
.box {
  width:100%;max-width:420px;padding:30px;
  border:1px solid #c9a65b;border-radius:18px;
  background:#1b1b1b;
}
h1 {color:#c9a65b;text-align:center}
input,button {
  width:100%;box-sizing:border-box;padding:16px;
  margin:10px 0;border-radius:10px;font-size:16px;
}
input {background:#101010;color:white;border:1px solid #555}
button {background:#c9a65b;border:0;font-weight:bold}
.recupero {
  background:transparent;color:#c9a65b;
  border:1px solid #c9a65b;
}
#messaggio {color:#ff7777;line-height:1.5}
</style>
</head>
<body>
<div class="box">
<h1>G.M. Automotive</h1>
<h2>Accesso gestionale</h2>

<form id="loginForm">
<input id="email" type="email" placeholder="Email" required>
<input id="password" type="password" placeholder="Password" required>
<button type="submit">ACCEDI</button>
</form>

<button type="button" class="recupero" id="recupero">
RECUPERA PASSWORD
</button>

<p id="messaggio"></p>
</div>

<script>
const db = supabase.createClient(
  'https://amnibfcgruniqzvjoaxn.supabase.co',
  'sb_publishable_ya3B1_8f4nh5J4sokWhCHw_6mzOjWWv'
);

const messaggio = document.getElementById('messaggio');

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  messaggio.textContent = 'Accesso in corso...';

  const { error } = await db.auth.signInWithPassword({
    email: document.getElementById('email').value.trim(),
    password: document.getElementById('password').value
  });

  if (error) {
    messaggio.textContent = error.message;
    return;
  }

  window.location.href = './index.html';
});

document.getElementById('recupero').addEventListener('click', async () => {
  const email = document.getElementById('email').value.trim();

  if (!email) {
    messaggio.textContent = 'Inserisci prima la tua email.';
    return;
  }

  messaggio.textContent = 'Invio richiesta in corso...';

  const { error } = await db.auth.resetPasswordForEmail(email, {
    redirectTo: 'https://giovannimelchiorre-collab.github.io/gm-automotive/reset-password.html'
  });

  if (error) {
    messaggio.textContent = 'Errore: ' + error.message;
    return;
  }

  messaggio.style.color = '#c9a65b';
  messaggio.textContent = 'Email inviata! Controlla la tua posta.';
});
</script>
</body>
</html>
