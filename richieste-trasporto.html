
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101010">
<title>Richiesta Trasporto - G.M. Automotive</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 padding:20px;
 background:#101010;
 color:white;
 font-family:Arial,sans-serif;
}

.container{
 max-width:600px;
 margin:25px auto;
 padding:25px;
 background:#191919;
 border:1px solid #b99a45;
 border-radius:14px;
}

h1{
 text-align:center;
 color:#d4af55;
 font-size:25px;
}

.subtitle{
 text-align:center;
 color:#ccc;
 margin-bottom:25px;
}

label{
 display:block;
 margin:15px 0 7px;
 color:#d4af55;
 font-weight:bold;
}

input,textarea{
 width:100%;
 padding:13px;
 border:1px solid #555;
 border-radius:7px;
 background:#101010;
 color:white;
 font-size:16px;
}

textarea{
 min-height:90px;
 resize:vertical;
}

button{
 width:100%;
 margin-top:25px;
 padding:16px;
 background:#d4af55;
 color:#111;
 border:0;
 border-radius:8px;
 font-size:16px;
 font-weight:bold;
 cursor:pointer;
}

button:disabled{
 opacity:.6;
}

.back{
 display:block;
 text-align:center;
 margin-top:20px;
 color:#d4af55;
 text-decoration:none;
}

#messaggio{
 margin-top:18px;
 text-align:center;
 font-weight:bold;
}

.small{
 color:#aaa;
 font-size:12px;
 text-align:center;
 margin-top:18px;
}
</style>
</head>

<body>

<div class="container">

<h1>G.M. AUTOMOTIVE</h1>
<p class="subtitle">Richiedi un preventivo per il tuo trasporto</p>

<form id="formRichiesta">

<label>Nome e cognome *</label>
<input type="text" id="nome" required>

<label>Telefono *</label>
<input type="tel" id="telefono" required>

<label>Email</label>
<input type="email" id="email">

<label>Veicolo *</label>
<input type="text" id="veicolo" required placeholder="Marca e modello">

<label>Targa</label>
<input type="text" id="targa">

<label>Luogo di ritiro *</label>
<input type="text" id="ritiro" required>

<label>Luogo di consegna *</label>
<input type="text" id="consegna" required>

<label>Data richiesta</label>
<input type="date" id="dataRitiro">

<label>Note aggiuntive</label>
<textarea id="note" placeholder="Inserisci eventuali informazioni aggiuntive"></textarea>

<button type="submit" id="invia">INVIA RICHIESTA</button>

</form>

<div id="messaggio"></div>

<p class="small">I campi contrassegnati con * sono obbligatori.</p>

<a class="back" href="./index.html">← Torna alla Home</a>

</div>

<script>
const SUPABASE_URL = "https://amnibfcgruniqzvjoaxn.supabase.co";
const SUPABASE_KEY = "sb_publishable_ya3B1_8f4nh5J4sokWhCHw_6mzOjWWv";

const supabaseClient = window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

const form = document.getElementById("formRichiesta");
const messaggio = document.getElementById("messaggio");
const bottone = document.getElementById("invia");

form.addEventListener("submit", async function(e){

 e.preventDefault();

 bottone.disabled = true;
 bottone.textContent = "INVIO IN CORSO...";
 messaggio.textContent = "";

 const richiesta = {
  nome: document.getElementById("nome").value.trim(),
  telefono: document.getElementById("telefono").value.trim(),
  email: document.getElementById("email").value.trim() || null,
  veicolo: document.getElementById("veicolo").value.trim(),
  targa: document.getElementById("targa").value.trim() || null,
  luogo_ritiro: document.getElementById("ritiro").value.trim(),
  luogo_consegna: document.getElementById("consegna").value.trim(),
  data_ritiro: document.getElementById("dataRitiro").value || null,
  note: document.getElementById("note").value.trim() || null
 };

 try{

  const { error } = await supabaseClient
   .from("richieste_clienti")
   .insert([richiesta]);

  if(error) throw error;

  messaggio.style.color = "#d4af55";
  messaggio.textContent =
   "Richiesta inviata correttamente! Ti contatteremo al più presto.";

  form.reset();

 }catch(error){

  console.error("Errore invio richiesta:", error);

  messaggio.style.color = "#ff7777";
  messaggio.textContent =
   messaggio.textContent =
   "ERRORE: " + (error.message || JSON.stringify(error));la richiesta. Riprova tra poco.";

 }finally{

  bottone.disabled = false;
  bottone.textContent = "INVIA RICHIESTA";

 }

});
</script>

</body>
</html>
