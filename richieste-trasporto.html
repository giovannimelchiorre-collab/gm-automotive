
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101010">
<title>Richieste Trasporto - G.M. Automotive</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
margin:0;padding:20px;
background:#101010;color:white;
font-family:Arial,sans-serif;
}
.container{
max-width:720px;margin:20px auto;
background:#191919;
border:1px solid #806b36;
border-radius:14px;padding:24px;
}
h1{text-align:center;color:#d4af55}
.subtitle{text-align:center;color:#aaa;margin-bottom:25px}
label{
display:block;color:#d4af55;
font-weight:bold;margin:15px 0 7px;
}
input,textarea{
width:100%;padding:13px;
border:1px solid #806b36;
border-radius:7px;background:#101010;
color:white;font-size:16px;
}
textarea{min-height:100px}
button{
width:100%;margin-top:22px;padding:15px;
border:0;border-radius:7px;
background:#d4af55;color:#111;
font-weight:bold;font-size:16px;
cursor:pointer;
}
button:disabled{opacity:.6}
#messaggio{
text-align:center;margin-top:18px;
line-height:1.5;
}
.nota{text-align:center;color:#aaa;font-size:13px}
@media(max-width:600px){
body{padding:10px}
.container{padding:18px}
}
</style>
</head>

<body>
<main class="container">

<h1>G.M. AUTOMOTIVE</h1>
<p class="subtitle">RICHIESTA TRASPORTO</p>

<form id="formRichiesta">

<label>Nome e cognome *</label>
<input name="nome" required>

<label>Telefono *</label>
<input name="telefono" type="tel" required>

<label>Email</label>
<input name="email" type="email">

<label>Veicolo da trasportare *</label>
<input name="veicolo" required>

<label>Targa</label>
<input name="targa">

<label>Luogo di ritiro *</label>
<input name="luogo_ritiro" required>

<label>Luogo di consegna *</label>
<input name="luogo_consegna" required>

<label>Data richiesta ritiro</label>
<input name="data_ritiro" type="date">

<label>Note aggiuntive</label>
<textarea name="note"></textarea>

<button id="invia" type="submit">
INVIA RICHIESTA
</button>

</form>

<div id="messaggio" role="status"></div>

<p class="nota">* Campi obbligatori</p>

</main>

<script>
const SUPABASE_URL =
"https://amnibfcgruniqzvjoaxn.supabase.co";

const SUPABASE_KEY =
"sb_publishable_ya3B1_8f4nh5J4sokWhCHw_6mzOjWWv";

const client = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

const form = document.getElementById("formRichiesta");
const invia = document.getElementById("invia");
const messaggio = document.getElementById("messaggio");

form.addEventListener("submit", async function(e){

e.preventDefault();

invia.disabled = true;
invia.textContent = "INVIO IN CORSO...";
messaggio.textContent = "";

const dati = new FormData(form);

const richiesta = {
nome: dati.get("nome").trim(),
telefono: dati.get("telefono").trim(),
email: dati.get("email").trim() || null,
veicolo: dati.get("veicolo").trim(),
targa: dati.get("targa").trim() || null,
luogo_ritiro: dati.get("luogo_ritiro").trim(),
luogo_consegna: dati.get("luogo_consegna").trim(),
data_ritiro: dati.get("data_ritiro") || null,
note: dati.get("note").trim() || null,
stato: "Nuova"
};

try {

const {error} = await client
.from("richieste_clienti")
.insert(richiesta);

if(error) throw error;

form.reset();

messaggio.textContent =
"Richiesta inviata correttamente! G.M. Automotive ti ricontatterà.";

} catch(error) {

console.error(error);

messaggio.textContent =
"Errore nell'invio. Riprova più tardi.";

} finally {

invia.disabled = false;
invia.textContent = "INVIA RICHIESTA";

}

});
</script>

</body>
</html>
